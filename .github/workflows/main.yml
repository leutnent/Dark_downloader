name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create buildozer.spec
        run: |
          pip install buildozer cython==0.29.33
          buildozer init
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy,yt-dlp,certifi,urllib3/g' buildozer.spec
          sed -i 's/#android.permissions = INTERNET/android.permissions = INTERNET,WRITE_EXTERNAL_STORAGE,READ_EXTERNAL_STORAGE/g' buildozer.spec
          sed -i 's/title = My Application/title = YT Downloader/g' buildozer.spec

      - name: Build APK with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          buildozer_version: stable

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YT-Downloader-APK
          path: ${{ steps.buildozer.outputs.filename }}
